name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression-tests:
    # This job name is the required status check in .github/rulesets/main.json.
    # Renaming it requires updating the ruleset too.
    name: regression-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxml2-utils jq python3-yaml
          # Pin shellcheck so lint results match local `make lint`.
          pip install --quiet shellcheck-py==0.11.0.1

      - name: Lint and regression tests
        run: make check
